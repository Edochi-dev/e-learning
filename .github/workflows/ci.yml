# ============================================================
#  CI — Integración continua
# ------------------------------------------------------------
#  Se ejecuta en cada push a `main` y en cada Pull Request.
#  Garantiza que el código compila y que los tests unitarios
#  del backend pasan antes de integrar cambios.
#
#  El paquete `@maris-nails/shared` se compila a dist/ (que NO
#  está en git), por eso es el PRIMER paso del build: tanto el
#  backend como el frontend lo consumen ya compilado.
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    # PostgreSQL efímero para los tests E2E. Coincide con apps/backend/.env.test
    # (localhost:5433, usuario/clave/DB de test). Se destruye al terminar el job.
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marisnails_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d marisnails_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` instala TODOS los workspaces de forma reproducible
      # a partir del package-lock.json de la raíz.
      - name: Install dependencies
        run: npm ci

      # Debe ir antes que backend y frontend: ambos importan su dist/.
      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Build backend
        run: npm run build -w apps/backend

      # Tests unitarios: usan mocks de los gateways, NO requieren base de datos.
      - name: Test backend (unit)
        run: npm run test -w apps/backend

      # Tests E2E: levantan la app real contra el PostgreSQL de servicio.
      # setup-e2e.ts carga .env.test (localhost:5433) y global-setup-e2e.ts
      # provisiona el esquema con las migraciones reales.
      - name: Test backend (e2e)
        run: npm run test:e2e -w apps/backend

      - name: Build frontend
        run: npm run build -w apps/frontend

      # Tests de frontend con Vitest (jsdom). No requieren base de datos.
      - name: Test frontend
        run: npm run test -w apps/frontend
